name: Mauritius news review collector
on:
  schedule:
    - cron: '17 * * * *'
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'news-sources.json'
      - '.github/workflows/mauritius-news-review.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - if: github.event_name != 'pull_request'
        run: python scripts/collect_news.py
      - name: Commit queue only
        if: github.event_name != 'pull_request'
        run: |
          if ! git diff --quiet -- news-review.json; then
            git config user.name 'fmp-news-bot'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add news-review.json
            git commit -m 'Refresh external news review queue'
            git push
          fi
