name: FMP Facebook media sync
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
concurrency:
  group: fmp-facebook-media-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch authorized public media links
        env:
          FMP_FACEBOOK_PAGE_ID: ${{ vars.FMP_FACEBOOK_PAGE_ID }}
          FMP_FACEBOOK_PAGE_TOKEN: ${{ secrets.FMP_FACEBOOK_PAGE_TOKEN }}
        run: |
          if [ -z "$FMP_FACEBOOK_PAGE_ID" ] || [ -z "$FMP_FACEBOOK_PAGE_TOKEN" ]; then
            echo "Page permission not configured; no changes made"
            exit 0
          fi
          python3 scripts/sync_fmp_facebook.py
      - name: Commit changes only
        run: |
          git add data/fmp-facebook-media.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update authorized FMP media links"
            git push
          fi
