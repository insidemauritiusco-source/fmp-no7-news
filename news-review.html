<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FMP No.7 — Revue des médias (brouillon)</title><style>body{font:16px system-ui;margin:0;background:#f3f5f7;color:#182334}main{max-width:880px;margin:auto;padding:22px}article{background:white;padding:18px;border-radius:10px;margin:12px 0;border:1px solid #dce2e8}a{color:#0754a1}small{color:#526274}button{padding:9px;margin:4px}header{background:#132e48;color:white;padding:18px}header a{color:white}</style><header><strong>FMP No.7 · Revue de presse mauricienne mauriciens</strong> · <a href="index.html">Accueil</a></header><main><h1>Actualités de Maurice · 48 dernières heures</h1><p id="clock" aria-live="off"></p><p>Tableau de prévisualisation uniquement. Aucun article de cette page n'est publié automatiquement. Les liens renvoient aux médias d'origine.</p><p id="status">Chargement…</p><section id="items"></section></main><script>function clock(){document.getElementById('clock').textContent='Heure de Maurice : '+new Intl.DateTimeFormat('fr-MU',{timeZone:'Indian/Mauritius',dateStyle:'full',timeStyle:'medium'}).format(new Date())}clock();setInterval(clock,1000);const clock=document.getElementById('clock');const tick=()=>clock.textContent='Heure de Maurice : '+new Intl.DateTimeFormat('fr-MU',{timeZone:'Indian/Mauritius',dateStyle:'full',timeStyle:'medium'}).format(new Date());tick();setInterval(tick,1000);const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('news-review.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Flux indisponible');return r.json()}).then(data=>{document.getElementById('status').textContent='Dossiers en attente : '+data.items.length+' dossiers · Dernière collecte : '+(data.updated_at?new Intl.DateTimeFormat('fr-MU',{timeZone:'Indian/Mauritius',dateStyle:'medium',timeStyle:'short'}).format(new Date(data.updated_at)):'inconnue');document.getElementById('items').innerHTML=data.items.filter(x=>x.status==='pending_review').map(x=>'<article><small>'+escapeHTML(x.publisher)+' · '+escapeHTML(x.date||'Date à vérifier')+' · NON PUBLIÉ</small><h2>'+escapeHTML(x.title)+'</h2><p>'+escapeHTML(x.note)+'</p><a href="'+encodeURI(x.source_url)+'" target="_blank" rel="noopener noreferrer">Consulter la source</a></article>').join('')}).catch(e=>document.getElementById('status').textContent='Aucune donnée de revue disponible.');</script></html>
